# Local preview. Shared VPS topology belongs to server-infrastructure.
services:
  app:
    build: .
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${LOCAL_PORT:-3000}:3000"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
